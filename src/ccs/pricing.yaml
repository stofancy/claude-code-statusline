# Claude Code Statusline — Multi-Provider Pricing Table
#
# Verified against official sources on 2026-05-12:
#   • Anthropic: https://platform.claude.com/docs/en/docs/about-claude/pricing
#   • DeepSeek:  https://api-docs.deepseek.com/quick_start/pricing
#   • OpenAI:    https://openai.com/api/pricing/
#   • Google:    https://ai.google.dev/gemini-api/docs/pricing
#   • MiMo:      https://platform.xiaomimimo.com/docs/zh-CN/price/pay-as-you-go
#   • MiniMax:   https://platform.minimaxi.com/docs/guides/pricing-paygo
#
# Per-model native currency
# -------------------------
# Every model block may declare a `currency: <CODE>` (defaulting to
# `base_currency` below) and an optional multi-currency `prices:` map.
# A model with native USD prices and no `currency` field is treated as
# USD — back-compatible with the legacy flat-dict format.
#
# Resolution order at lookup time:
#   1. `prices[display_currency]` — exact native value, no FX applied
#   2. `prices[base_currency]`   — exact native value, FX to display
#   3. Flat dict (legacy)        — used as-is
#
# `base_currency` is the FX pivot (USD by default). `display_currency`
# defaults to **CNY** so the status line shows ¥ — the convention for
# Chinese-speaking users. Override at runtime with env CCS_CURRENCY
# (e.g. `CCS_CURRENCY=USD`) or by setting `display_currency` in a
# user-level `~/.claude/statusline/pricing.yaml`. FX rates are in
# `fx_rates` below, expressed as *units of currency per 1 USD*.

base_currency: USD
display_currency: CNY

fx_rates:
  USD: 1.0
  CNY: 7.18
  EUR: 0.92
  GBP: 0.79
  JPY: 156.0
  AUD: 1.52
  INR: 83.5
  HKD: 7.82
  SGD: 1.34
  KRW: 1370.0
  CAD: 1.37
  CHF: 0.88
  TWD: 32.3

