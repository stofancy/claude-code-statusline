# Claude Code Statusline — Multi-Provider Pricing Table
#
# Verified against official sources on 2026-05-12:
#   • Anthropic: https://platform.claude.com/docs/en/docs/about-claude/pricing
#   • DeepSeek:  https://api-docs.deepseek.com/quick_start/pricing
#   • OpenAI:    https://openai.com/api/pricing/
#   • Google:    https://ai.google.dev/gemini-api/docs/pricing
#
# Prices are denominated in `base_currency` (USD by default). Override the
# *display* currency at runtime with env CCS_CURRENCY (e.g. CCS_CURRENCY=CNY),
# or by setting `display_currency` below. FX conversion uses `fx_rates`.

base_currency: USD
display_currency: USD

fx_rates:
  USD: 1.0
  CNY: 7.18
  EUR: 0.92
  GBP: 0.79
  JPY: 156.0
  AUD: 1.52
  INR: 83.5
  HKD: 7.82
  SGD: 1.34
  KRW: 1370.0
  CAD: 1.37
  CHF: 0.88
  TWD: 32.3

providers:

  # ─────────────────────────────────────────────────────────────────────────
  # Anthropic — published in USD; 5-minute cache write is the default rate.
  # 1-hour cache write is exactly 2× input if you need it.
  # Pricing formula: cache_write_5m = 1.25 × input; cache_read = 0.1 × input.
  # ─────────────────────────────────────────────────────────────────────────
  anthropic:
    claude-opus-4-7:
      input_per_1m: 5.00
      cache_write_per_1m: 6.25      # 5-minute cache write
      cache_read_per_1m: 0.50
      output_per_1m: 25.00
    claude-opus-4-7-20251001:
      input_per_1m: 5.00
      cache_write_per_1m: 6.25
      cache_read_per_1m: 0.50
      output_per_1m: 25.00

