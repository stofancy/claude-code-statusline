# Claude Code Statusline — Multi-Provider Pricing Table
#
# Verified against official sources on 2026-10-28（逐家重核；本轮修正 DeepSeek Flash、
# gpt-5、gpt-5.6-sol 的过期价，补入 deepseek-flash / mimo-v2.6 系列）：
#   • Anthropic: https://platform.claude.com/docs/en/docs/about-claude/pricing
#   • DeepSeek:  https://api-docs.deepseek.com/quick_start/pricing
#   • OpenAI:    https://openai.com/api/pricing/
#   • Google:    https://ai.google.dev/gemini-api/docs/pricing
#   • MiMo:      https://platform.xiaomimimo.com/docs/zh-CN/price/pay-as-you-go
#   • MiniMax:   https://platform.minimaxi.com/docs/guides/pricing-paygo
#
# Per-model currency
# ------------------
# A model block carries either a multi-currency `prices:` map
# (`prices.CNY`, `prices.USD`, …) or a legacy flat dict (priced in
# `base_currency`, i.e. USD). There is no `currency:` field — the block
# that is used decides the currency.
#
# Resolution order at lookup time — **人民币优先，无人民币价回退美元**:
#   1. `prices.CNY`               — 有人民币价就按人民币计价
#   2. `prices[base_currency]`    — 无 CNY 块时回退（默认 USD）
#   3. `prices[display_currency]` — 用户显示币种
#   4. 首个可用块                 — 最后兜底
# 用哪个块计价就按哪个币种显示（CNY 计价显示 ¥，不经过汇率）；用非 CNY 块
# 计价时才经 `fx_rates` 换算成显示币种。
#
# `base_currency` is the FX pivot (USD by default). `display_currency`
# defaults to **CNY** so the status line shows ¥ — the convention for
# Chinese-speaking users. Override at runtime with env CCS_CURRENCY
# (e.g. `CCS_CURRENCY=USD`) or by setting `display_currency` in a
# user-level `~/.claude/statusline/pricing.yaml`. FX rates are in
# `fx_rates` below, expressed as *units of currency per 1 USD*.
#
# Relationship to models.dev (ccs/catalog.py)
# -------------------------------------------
# USD list prices are also fetched daily from https://models.dev, and FX
# rates daily from open.er-api.com. Per model id:
#   • entries with `currency` / `prices` / `tide` / `tiers`
#     (and everything in the user's pricing.yaml) always win — they encode
#     what models.dev cannot (native CNY prices, 峰谷, custom tiers);
#   • otherwise models.dev wins, and plain USD entries here are only the
#     offline fallback.
# `fx_rates` below is likewise only the fallback for the fetched rates;
# `fx_rates` in the user's pricing.yaml pins a rate.
#
# Context-length tiers: `tiers: [{above: N, <rates>}]` — a call whose prompt
# (input + cache_read + cache_write) exceeds N tokens is billed at that tier.
#
# Model id matching (ccs/cost.py)
# ------------------------------
# Gateways spell the same model many ways (`newapi/deepseek-flash`,
# `deepseek-flash-newapi`, `deepseek-flash[1m]`, `claude-opus-4.8`). Lookup
# applies three layers in order:
#   1. `patterns:` rules (below) — explicit override, first glob wins;
#   2. exact chain: `[1m]` stripped, dot versions dashed, proxy prefixes
#      (`newapi/`, `openrouter/vendor/`) and trailing variant/version
#      suffixes (`-v2`, `-newapi`, `-20250714`) stripped in any combination;
#   3. rapidfuzz token match: the table key's tokens must all appear in the
#      id (order-free), a key carrying a version token the id lacks — or a
#      different generation (`v3` vs `v4`) — is rejected, and the survivors
#      are ranked by `fuzz.token_set_ratio` (cutoff 50).
# Unknown ids fall back to the default block and log under `CCS_DEBUG=1`.
#
# `patterns:` maps id shapes onto an existing key (last resort for gateways
# whose naming no rule reaches; `*` also crosses `/`):
#
#   patterns:
#     - match: "*deepseek-v4-flash*"   # case-insensitive glob
#       use: deepseek-v4-flash         # any key already in this table

base_currency: USD
display_currency: CNY

fx_rates:
  USD: 1.0
  CNY: 7.18
  EUR: 0.92
  GBP: 0.79
  JPY: 156.0
  AUD: 1.52
  INR: 83.5
  HKD: 7.82
  SGD: 1.34
  KRW: 1370.0
  CAD: 1.37
  CHF: 0.88
  TWD: 32.3

