  # ─────────────────────────────────────────────────────────────────────────
  # DeepSeek — published in USD on api-docs.deepseek.com.
  # v4-pro shows promotional 75% discount through 2026-05-31. After that the
  # standard rate is 4× the listed numbers.
  # ─────────────────────────────────────────────────────────────────────────
  deepseek:
    deepseek-v4-pro:
      input_per_1m: 0.435
