  # ─────────────────────────────────────────────────────────────────────────
  # MiniMax — list price is published in CNY (元) per 1M tokens. Authored
  # here in CNY with `currency: CNY` so the per-model native currency is
  # preserved (no FX rounding, status line shows ¥ as published). USD
  # equivalents are reproduced under `prices.USD` for users whose
  # `display_currency` is USD — they pick up the precise USD value when
  # one is published, and fall back to the CNY block + FX otherwise.
  # Source: https://platform.minimaxi.com/docs/guides/pricing-paygo
  #
  # Rounding policy: CNY values rounded to 2 decimal places (1 分); USD
  # equivalents rounded to 4 decimal places. The forward and reverse
  # conversions agree to within 0.5 分 (e.g. 2.10 CNY / 7.18 = 0.2925 USD).
  #
  # Model IDs match the verbatim strings returned by api.minimaxi.com
  # (PascalCase, with the platform's "HightSpeed" spelling). The `[1m]`
  # suffix used by the 1-hour-cache variant is stripped automatically by
  # cost._resolve_price before lookup, so MiniMax-M3[1m] resolves to
  # MiniMax-M3.
  #
  # M3 pricing is the ≤512k input tier, 7-day limited 50% promotional price
  # (matches the page's bold/current numbers; standard rate is 2× the promo).
  # The page also publishes a >512k tier (4× these rates) gated behind a
  # quota and not modeled here. M3 cache_write is not published and is
  # therefore not billed.
  # ─────────────────────────────────────────────────────────────────────────
