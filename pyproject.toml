[project]
name = "claude-code-statusline"
version = "1.0.0"
description = "Production-grade statusline for Claude Code optimized for DeepSeek provider"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ccs-statusline = "ccs.statusline:main"
ccs-tracker = "ccs.tracker:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
