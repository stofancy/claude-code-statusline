[project]
name = "claude-code-statusline"
version = "1.1.0"
description = "Multi-provider custom statusline for Claude Code with JSONL-transcript-based token tracking"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/stofancy/claude-code-statusline"
Repository = "https://github.com/stofancy/claude-code-statusline.git"
Issues = "https://github.com/stofancy/claude-code-statusline/issues"

[project.scripts]
ccs-statusline = "ccs.statusline:main"
ccs-tracker = "ccs.tracker:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccs = ["pricing.yaml", "locales/*.yaml"]
